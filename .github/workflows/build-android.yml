name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New app version tag (use the same version as the Windows build)"
        required: true
        default: "v1.1.0"
permissions: { contents: write }
env:
  GODOT_VERSION: "4.7.2"
  RELEASE_TAG: ${{ inputs.release_tag || 'v1.1.0' }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for p in "platform-tools" "build-tools;35.0.1" "build-tools;36.0.0" "platforms;android-35" "platforms;android-36"; do "$SDKM" "$p" || true; done
      - name: Install Godot + templates
        run: |
          B=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates && unzip -q Godot_v*_export_templates.tpz && mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
      - name: Gradle build template (the blocktopia:// link comes from the addons/blocktopia_link export plugin)
        run: |
          cd GodotClient
          sed -i "s|^config/version=.*|config/version=\"$RELEASE_TAG\"|" project.godot
          set -o pipefail
          godot --headless --import 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/godot-import.log; then exit 1; fi
          mkdir -p android && cp -r ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip android/ && cd android && unzip -q -o android_source.zip -d build && rm android_source.zip && cd ..
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          sed -i 's/gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/' export_presets.cfg
          grep -n "use_gradle_build" export_presets.cfg
      - name: Export APK
        run: |
          cd GodotClient && mkdir -p ../Builds/Android && godot --headless --export-debug "Android" ../Builds/Android/BlockTopia.apk
      - name: Check the APK really contains the blocktopia:// link
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT2 dump xmltree --file AndroidManifest.xml Builds/Android/BlockTopia.apk > manifest.txt
          grep -n "scheme\|MAIN\|VIEW\|package=" manifest.txt | head -20
          grep -E "scheme.*=\"blocktopia\"" manifest.txt >/dev/null || { echo "::error::The APK has no blocktopia:// intent filter"; cat manifest.txt | head -80; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: Builds/Android/BlockTopia.apk }
      - name: Publish versioned Android release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "BlockTopia $RELEASE_TAG" --notes "BlockTopia desktop and Android app release."
          gh release upload "$RELEASE_TAG" Builds/Android/BlockTopia.apk --clobber
