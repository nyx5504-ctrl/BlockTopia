name: Build Android APK
on: { workflow_dispatch: {} }
env: { GODOT_VERSION: "4.7.2" }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK (use the runner's preinstalled SDK, add what Godot needs)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME" || true
          yes | "$SDKM" --licenses > /dev/null || true
          for p in "platform-tools" "build-tools;35.0.1" "build-tools;36.0.0" "platforms;android-35" "platforms;android-36"; do
            "$SDKM" "$p" || true
          done
          "$SDKM" --list_installed || true
      - name: Install Godot + templates, create debug keystore, export APK
        run: |
          B=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates && unzip -q Godot_v*_export_templates.tpz && mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
          cd GodotClient && godot --headless --import || true
          mkdir -p ../Builds/Android && godot --headless --export-debug "Android" ../Builds/Android/BlockTopia.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: Builds/Android/BlockTopia.apk }
