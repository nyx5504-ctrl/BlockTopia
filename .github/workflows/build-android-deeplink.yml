name: Build Android APK (opens from website)
# OPTIONAL. Same as "Build Android APK", but the app also registers the blocktopia:// link, so pressing Play on the website
# opens the app by itself. Uses a Gradle build. Run it; if it fails, keep using the normal "Build Android APK" workflow.
on: { workflow_dispatch: {} }
permissions: { contents: write }
env: { GODOT_VERSION: "4.7.2" }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for p in "platform-tools" "build-tools;35.0.1" "build-tools;36.0.0" "platforms;android-35" "platforms;android-36"; do "$SDKM" "$p" || true; done
      - name: Install Godot + templates
        run: |
          B=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates && unzip -q Godot_v*_export_templates.tpz && mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
      - name: Gradle build template + blocktopia:// intent filter
        run: |
          cd GodotClient
          godot --headless --import || true
          mkdir -p android && cp -r ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip android/ && cd android && unzip -q -o android_source.zip -d build && rm android_source.zip && cd ..
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          python3 - <<'PY'
          p="android/build/AndroidManifest.xml"
          s=open(p).read()
          f='''<intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="blocktopia" />
                  </intent-filter>
                  '''
          i=s.index("<intent-filter>")
          s=s[:i]+f+s[i:]
          open(p,"w").write(s)
          print("manifest patched")
          PY
          sed -i 's/gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/' export_presets.cfg
          grep -n "use_gradle_build" export_presets.cfg
      - name: Export APK
        run: |
          cd GodotClient && mkdir -p ../Builds/Android && godot --headless --export-debug "Android" ../Builds/Android/BlockTopia.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk-deeplink, path: Builds/Android/BlockTopia.apk }
      - name: Publish to release v1.0
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload v1.0 Builds/Android/BlockTopia.apk --clobber
