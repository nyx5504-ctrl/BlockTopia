<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlockTopia</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth"><div class="card">
<div class="brand"><img src="assets/logo.svg" alt="">BlockTopia</div>
<div class="tabs"><button id="tLogin" class="on" type="button">Log in</button><button id="tSign" type="button">Sign up</button></div>
<form id="form">
<div id="fUser" class="hide"><label for="username">Username</label><input id="username" maxlength="20" autocomplete="username" placeholder="3-20 letters, numbers, _"></div>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required>
<button class="btn" id="go" type="submit">Log in</button>
<button class="link" id="forgot" type="button">Forgot password?</button>
<div class="msg" id="msg"></div></form></div></div>
<script type="module" src="js/auth.js"></script></body></html>
